name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Code only. The documentation checks (sim/tests/test_docs.py) are not part of CI.
      - run: uv run pytest -q --ignore=sim/tests/test_docs.py
      - run: uv run python -m sim.parity check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Includes the parity test: replays sim/tests/golden/parity_traces.json through the port.
      - run: npm test
      - run: npm run build
