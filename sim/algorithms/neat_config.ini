# neat-python configuration for the Dino task. Checked in so that every run uses the same file.
#
# Input and output counts match the game: 9 observations (including the constant bias input)
# and 3 actions. Activations are plain tanh: the runner registers math.tanh under the name
# "tanh", replacing neat-python's built-in tanh(2.5 z), so exported genomes use the same
# function as the fixed network. Response multipliers are pinned to 1 so the exported nodes
# only need a bias.
#
# Evolution starts from the smallest network: every input connected straight to every output,
# no hidden nodes. Hidden nodes and extra connections appear only through mutation.

[NEAT]
fitness_criterion     = max
# Never reached; the runner stops on its environment-step budget instead.
fitness_threshold     = 1000000000
pop_size              = 150
reset_on_extinction   = True
no_fitness_termination = True

[DefaultGenome]
num_inputs              = 9
num_outputs             = 3
num_hidden              = 0
feed_forward            = True
initial_connection      = full_direct

compatibility_disjoint_coefficient = 1.0
compatibility_weight_coefficient   = 0.5

conn_add_prob           = 0.3
conn_delete_prob        = 0.15
node_add_prob           = 0.1
node_delete_prob        = 0.05
single_structural_mutation = False
structural_mutation_surer  = default

activation_default      = tanh
activation_mutate_rate  = 0.0
activation_options      = tanh

aggregation_default     = sum
aggregation_mutate_rate = 0.0
aggregation_options     = sum

bias_init_mean          = 0.0
bias_init_stdev         = 0.5
bias_max_value          = 8.0
bias_min_value          = -8.0
bias_mutate_power       = 0.3
bias_mutate_rate        = 0.2
bias_replace_rate       = 0.02

response_init_mean      = 1.0
response_init_stdev     = 0.0
response_max_value      = 1.0
response_min_value      = 1.0
response_mutate_power   = 0.0
response_mutate_rate    = 0.0
response_replace_rate   = 0.0

weight_init_mean        = 0.0
weight_init_stdev       = 0.5
weight_max_value        = 8.0
weight_min_value        = -8.0
weight_mutate_power     = 0.3
weight_mutate_rate      = 0.4
weight_replace_rate     = 0.02

enabled_default         = True
enabled_mutate_rate     = 0.01

[DefaultSpeciesSet]
compatibility_threshold = 1.0

[DefaultStagnation]
species_fitness_func    = max
max_stagnation          = 20
species_elitism         = 2

[DefaultReproduction]
elitism                 = 2
survival_threshold      = 0.2
min_species_size        = 1
